services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: jyutjyu:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_PUBLIC_USE_API: ${NUXT_PUBLIC_USE_API:-false}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-http://localhost:3000}
      ENFORCE_CANONICAL_HOST_REDIRECT: ${ENFORCE_CANONICAL_HOST_REDIRECT:-false}
      NUXT_PUBLIC_TTS_ENABLED: ${NUXT_PUBLIC_TTS_ENABLED:-false}
      NUXT_PUBLIC_TTS_MANIFEST_PATH: ${NUXT_PUBLIC_TTS_MANIFEST_PATH:-/tts/manifest.v1.json}
      NUXT_PUBLIC_TTS_BASE_URL: ${NUXT_PUBLIC_TTS_BASE_URL:-/tts/audio}
      NUXT_PUBLIC_TTS_VOICE_VERSION: ${NUXT_PUBLIC_TTS_VOICE_VERSION:-v1}
    ports:
      - "3000:3000"
